[project]
name = "irp"
version = "0.1.0"
description = "Replayable, policy-gated incident-response orchestration pipeline (planning only; executes no infrastructure actions)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.scripts]
irp = "irp.interface.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "jsonschema>=4.22",
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
